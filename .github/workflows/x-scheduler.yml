name: X scheduled posts

on:
  schedule:
    - cron: "*/15 * * * *" # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
  push:
    paths:
      - "x-scheduler/**"

concurrency:
  group: x-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r x-scheduler/requirements.txt

      - name: Validate posts.yaml
        run: python x-scheduler/post_scheduled.py --check

      # Only the default branch posts; other branches just validate.
      - name: Post due entries
        if: github.ref_name == github.event.repository.default_branch
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python x-scheduler/post_scheduled.py

      - name: Save posted status
        if: always() && github.ref_name == github.event.repository.default_branch
        run: |
          git diff --quiet x-scheduler/posts.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "x-scheduler: record posted entries [skip ci]"
          git pull --rebase
          git push
